<header class="header">
  <div class="header__inner">
    <a routerLink="/" class="header__logo">
      <span class="header__logo-icon">♪</span>
      <span class="header__logo-text">Agenda<span class="highlight">Clayton</span></span>
    </a>
    <nav class="header__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="header__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a>
      <a routerLink="/novo" routerLinkActive="active" class="header__link header__link--primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Show
      </a>
    </nav>
    <button class="header__menu-btn" aria-label="Menu" (click)="menuOpen = !menuOpen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  @if (menuOpen) {
    <div class="header__mobile-nav">
      <a routerLink="/" (click)="menuOpen = false" class="header__mobile-link">Dashboard</a>
      <a routerLink="/novo" (click)="menuOpen = false" class="header__mobile-link header__mobile-link--primary">Novo Show</a>
    </div>
  }
</header>
